services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:local_dev_change_me@db:5432/jobmatch
      CORS_ORIGINS: http://localhost:5173
      MAX_UPLOAD_MB: 5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
